---
# Restart Vault only where it already runs (try-restart): cluster nodes that
# are configured but not yet started stay down. One node at a time.
- name: Reload systemd units
  ansible.builtin.systemd_service:
    daemon_reload: true
  listen: Restart vault

- name: Try-restart vault
  ansible.builtin.command:
    argv: [systemctl, try-restart, vault]
  throttle: 1
  # rc 5: the unit is not installed yet (first converge), nothing to restart.
  register: vault_configure_try_restart
  changed_when: vault_configure_try_restart.rc == 0
  failed_when: vault_configure_try_restart.rc not in [0, 5]
  listen: Restart vault
