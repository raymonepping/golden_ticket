---
# Open lab_common_fw_port/tcp either to everyone (lab_common_fw_sources empty) or only to the given
# source addresses (firewalld rich rules), removing the other form.
# vars: lab_common_fw_port (int), lab_common_fw_sources (list of IPv4 addresses)

- name: "Open to everyone, or close to everyone: port {{ lab_common_fw_port }}"
  ansible.posix.firewalld:
    port: "{{ lab_common_fw_port }}/tcp"
    permanent: true
    immediate: true
    state: "{{ 'enabled' if lab_common_fw_sources | length == 0 else 'disabled' }}"

- name: "Allow only the listed sources: port {{ lab_common_fw_port }}"
  ansible.posix.firewalld:
    rich_rule: 'rule family="ipv4" source address="{{ item }}/32" port port="{{ lab_common_fw_port }}" protocol="tcp" accept'
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ lab_common_fw_sources }}"
