---
# The RHEL baseline of every golden_ticket VM. Normally run by Terraform
# (ansible_playbook.baseline in terraform/infra); converge.yml runs it again
# and must see changed=0. Ported from red_pass rhel_prepare + vault_install
# (swap) + vault_configure (/etc/hosts). Credentials come only from the
# controller environment through no_log tasks.

- name: Require RHEL 9 on ARM64 with SELinux enforcing
  ansible.builtin.assert:
    that:
      - ansible_facts['architecture'] == 'aarch64'
      - ansible_facts['distribution'] == 'RedHat'
      - ansible_facts['distribution_major_version'] == '9'
      - ansible_facts['selinux']['status'] == 'enabled'
      - ansible_facts['selinux']['mode'] == 'enforcing'
    fail_msg: "{{ inventory_hostname }} must be RHEL 9 ARM64 with SELinux enforcing."
    quiet: true

- name: Check Red Hat registration
  ansible.builtin.command:
    argv: [subscription-manager, identity]
  register: rhel_baseline_rhsm_identity
  changed_when: false
  check_mode: false
  failed_when: false

- name: Register an unregistered guest with Red Hat
  when: rhel_baseline_rhsm_identity.rc != 0
  block:
    - name: Test Red Hat endpoint resolution
      ansible.builtin.command:
        argv: [getent, ahosts, subscription.rhsm.redhat.com]
      register: rhel_baseline_rhsm_dns
      changed_when: false
      check_mode: false
      failed_when: false

    - name: Repair a DNS-only Multipass failure through NetworkManager
      when: rhel_baseline_rhsm_dns.rc != 0
      block:
        - name: Verify raw HTTPS connectivity before changing DNS
          ansible.builtin.command:
            argv: [curl, -kfsS, --connect-timeout, "5", --max-time, "10", -o, /dev/null, https://1.1.1.1/]
          changed_when: false

          check_mode: false
        - name: Read the active NetworkManager connection
          ansible.builtin.command:
            argv: [nmcli, -g, GENERAL.CONNECTION, device, show, eth0]
          register: rhel_baseline_nm_connection
          changed_when: false

          check_mode: false
        - name: Configure the fallback resolvers
          ansible.builtin.command:
            argv:
              - nmcli
              - connection
              - modify
              - "{{ rhel_baseline_nm_connection.stdout }}"
              - ipv4.ignore-auto-dns
              - "yes"
              - ipv4.dns
              - "{{ lookup('env', 'RHEL_DNS_SERVERS') | default('1.1.1.1,1.0.0.1', true) }}"
          changed_when: true

        - name: Reapply the NetworkManager connection
          ansible.builtin.command:
            argv: [nmcli, device, reapply, eth0]
          changed_when: true

        - name: Require Red Hat endpoint resolution after repair
          ansible.builtin.command:
            argv: [getent, ahosts, subscription.rhsm.redhat.com]
          register: rhel_baseline_rhsm_dns_repaired
          changed_when: false
          check_mode: false
          retries: 10
          delay: 1
          until: rhel_baseline_rhsm_dns_repaired.rc == 0

    - name: Require activation-key inputs for an unregistered guest
      ansible.builtin.assert:
        that:
          - lookup('env', 'RHSM_ORG') | length > 0
          - lookup('env', 'RHSM_ACTIVATION_KEY') | length > 0
        fail_msg: RHEL registration is required; set RHSM_ORG and RHSM_ACTIVATION_KEY in .env.
        quiet: true
      no_log: true

    - name: Register with Red Hat using the activation key
      ansible.builtin.command:
        argv:
          - subscription-manager
          - register
          - "--org={{ lookup('env', 'RHSM_ORG') }}"
          - "--activationkey={{ lookup('env', 'RHSM_ACTIVATION_KEY') }}"
          - --name={{ inventory_hostname }}
      register: rhel_baseline_rhsm_register
      changed_when: true
      no_log: true

- name: Require an enabled RHEL repository
  ansible.builtin.command:
    argv: [dnf, -q, repolist, --enabled]
  register: rhel_baseline_repos
  changed_when: false
  check_mode: false
  failed_when: rhel_baseline_repos.rc != 0 or rhel_baseline_repos.stdout | trim | length == 0

- name: Install the baseline packages from the enabled RHEL repositories
  ansible.builtin.dnf:
    name: "{{ baseline_packages }}"
    state: present

- name: Enable and start firewalld (no ports opened here; each role opens its own)
  ansible.builtin.systemd_service:
    name: firewalld
    state: started
    enabled: true

# ── Swap (Raft and Vault want none; harmless on service nodes) ───────────────
- name: Read active swap
  ansible.builtin.command:
    argv: [swapon, --show, --noheadings]
  register: rhel_baseline_active_swap
  changed_when: false
  check_mode: false

- name: Disable active swap
  ansible.builtin.command:
    argv: [swapoff, -a]
  changed_when: true
  when: rhel_baseline_active_swap.stdout | trim | length > 0

- name: Keep swap disabled across reboots
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].+\sswap\s.+)$'
    replace: '# golden-ticket disabled: \1'

# ── Peers by name ────────────────────────────────────────────────────────────
# One block, never remove-then-add (multi_pass's per-line delete + re-add
# reported changed on every run). Multipass vendor-data sets
# manage_etc_hosts: true, so cloud-init rewrites /etc/hosts from its template
# on every boot: manage both.
- name: Resolve every lab node by name (now and after every reboot)
  ansible.builtin.blockinfile:
    path: "{{ item }}"
    marker: "# {mark} golden-ticket peers (managed by Ansible)"
    block: |
      {% for name in groups['gt'] | sort %}
      {{ hostvars[name].ansible_host }} {{ name }}
      {% endfor %}
  loop:
    - /etc/hosts
    - /etc/cloud/templates/hosts.redhat.tmpl

# ── Time ─────────────────────────────────────────────────────────────────────
# Multipass guests fall minutes behind after host sleep; RHEL's default
# `makestep 1.0 3` only steps at boot, so chrony slews for hours. Tokens
# (OIDC exp/iat, Vault TTLs) then look expired. Allow stepping at any time.
- name: Let chrony step the clock whenever it is off by more than a second
  ansible.builtin.lineinfile:
    path: /etc/chrony.conf
    regexp: '^makestep\s'
    line: makestep 1.0 -1
  register: rhel_baseline_chrony_conf

# Guests lose time quickly under Multipass; poll at most every 64 s so a drift
# is measured (and stepped) within a minute instead of chrony's ~17 min.
- name: Poll NTP often enough to catch Multipass drift
  ansible.builtin.lineinfile:
    path: /etc/chrony.conf
    regexp: '^pool\s'
    line: pool 2.rhel.pool.ntp.org iburst maxpoll 6
  register: rhel_baseline_chrony_pool

- name: Restart chronyd after a configuration change
  ansible.builtin.systemd_service:
    name: chronyd
    state: restarted
    enabled: true
  when: rhel_baseline_chrony_conf is changed or rhel_baseline_chrony_pool is changed

# With makestep 1.0 -1 the next measurement steps the clock; wait for it
# (corrections below 1 s). After a large jump (host sleep) chrony can mark
# every source unusable and stay "Not synchronised"; a restart re-runs the
# initial burst and steps. Time sync is maintenance, not configuration, so it
# is never reported as a change (check mode stays meaningful).
- name: Keep the clock synchronised
  block:
    - name: Wait until the clock is synchronised within a second
      ansible.builtin.command:
        argv: [chronyc, waitsync, "15", "1", "0", "2"]
      changed_when: false
      check_mode: false
  rescue:
    - name: Restart chronyd after a clock jump
      ansible.builtin.systemd_service:
        name: chronyd
        state: restarted
      changed_when: false
      check_mode: false

    - name: Wait again until the clock is synchronised
      ansible.builtin.command:
        argv: [chronyc, waitsync, "30", "1", "0", "2"]
      changed_when: false
      check_mode: false

# ── Evidence: which baseline this node runs (read by the probe/console) ──────
- name: Record the baseline digest on the node
  when: baseline_digest is defined
  block:
    - name: Ensure /etc/golden-ticket exists
      ansible.builtin.file:
        path: /etc/golden-ticket
        state: directory
        mode: "0755"

    - name: Write the baseline digest
      ansible.builtin.copy:
        content: "{{ baseline_digest }}\n"
        dest: /etc/golden-ticket/baseline
        mode: "0644"
