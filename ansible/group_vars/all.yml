---
# Non-topology settings only. Names, groups, roles, addresses and sizing come
# from Terraform (terraform/infra inventory resources / outputs).

project_name: golden_ticket
repo_root: "{{ (playbook_dir ~ '/..') | realpath }}"

# ── Controller paths (all ignored by Git) ────────────────────────────────────
secrets_dir: "{{ repo_root }}/.secrets"
build_dir: "{{ repo_root }}/.build"
cache_dir: "{{ repo_root }}/.cache"
tf_dir: "{{ repo_root }}/terraform"
tls_dir: "{{ secrets_dir }}/tls"
tokens_dir: "{{ secrets_dir }}/tokens"
ssh_dir: "{{ secrets_dir }}/ansible"
ssh_private_key: "{{ ssh_dir }}/id_ed25519"
ssh_known_hosts: "{{ ssh_dir }}/known_hosts"

# ── Images (Multipass content-cache workaround) ──────────────────────────────
lab_image: "{{ lookup('env', 'GT_IMAGE') | default('/Users/Shared/rhel-9.8-aarch64-kvm.qcow2', true) }}"
lab_image_clone_dir: /Users/Shared/gt-images

# Other projects' VMs: never touched. Preflight refuses to build while any of
# them runs (the Mac cannot hold two labs).
foreign_vm_patterns: ['^red-', '^vault-[0-9]+$']

# ── Guests ───────────────────────────────────────────────────────────────────
lab_ssh_user: ubuntu
lab_guest_python: /usr/bin/python3.9
baseline_packages: [python3, curl, jq, tar, unzip, policycoreutils-python-utils, firewalld, chrony]

# ── Names derived from the Terraform inventory (never listed here) ───────────
lab_seal_node: "{{ groups['vault_seal'] | default(['gt-vault-s']) | first }}"
agent_node: "{{ groups['agent'] | default(['gt-agent-1']) | first }}"
proxy_node: "{{ groups['proxy'] | default(['gt-proxy-1']) | first }}"
identity_node: "{{ groups['identity'] | default(['gt-identity-1']) | first }}"
ux_node: "{{ groups['ux'] | default(['gt-ux-1']) | first }}"
vault_leader: >-
  {{ (groups['vault'] | default([]) | map('extract', hostvars)
      | selectattr('vault_role', 'defined') | selectattr('vault_role', 'equalto', 'leader')
      | map(attribute='inventory_hostname') | list + ['gt-vault-1']) | first }}

# ── Vault Enterprise ─────────────────────────────────────────────────────────
vault_version: "2.1.0+ent"
vault_archive_sha256: "a0fbfb3fb07e5c4574f07062338f8fb10b4464c0622e3cc9b3b030d3c9afc2da"
vault_arch: linux_arm64
vault_bin: /usr/local/bin/vault
vault_config_dir: /etc/vault.d
vault_config_file: /etc/vault.d/vault.hcl
vault_data_dir: /opt/vault/data
vault_tls_dir: /opt/vault/tls
vault_license_dest: /opt/vault/vault.hclic
vault_api_port: 8200
vault_cluster_port: 8201
vault_ca_cert: "{{ tls_dir }}/ca.crt"

# ── Seal chain ───────────────────────────────────────────────────────────────
# gt-vault-s: Shamir 1/1. Its Transit structure (mount, key "autounseal",
# policies, AppRole roles) is Terraform's (terraform/seal). The cluster
# reaches it only through the seal agent and holds no seal credential.
seal_key_shares: 1
seal_key_threshold: 1
seal_transit_mount: transit
seal_transit_key: autounseal
recovery_shares: 3
recovery_threshold: 2
seal_init_path: "{{ secrets_dir }}/seal-init.json"
vault_init_path: "{{ secrets_dir }}/vault-init.json"

# Written once the agent is proven from a cluster node (prompt 04): only then
# may the cluster nodes start.
seal_agent_marker: "{{ build_dir }}/seal-agent.json"
vault_cluster_may_start: "{{ seal_agent_marker is file }}"
agent_port: 8100
agent_metrics_port: 8101

# ── Bootstrap tokens: one per tool per Vault (the boundary Vault enforces) ──
# Ansible writes these four policies with the root token; Terraform never
# manages them. Token files: .secrets/tokens/<file>.
bootstrap_token_period: 24h
seal_bootstrap_tokens:
  - { policy: gt-tf-seal, file: tf-seal }
  - { policy: gt-ansible-seal, file: ansible-seal }
cluster_bootstrap_tokens:
  - { policy: gt-tf-platform, file: tf-platform }
  - { policy: gt-ansible-platform, file: ansible-platform }

# ── Read-only node probe (console) ──────────────────────────────────────────
probe_user: gtprobe
probe_script: /usr/local/libexec/gt-probe
probe_key: "{{ secrets_dir }}/ux/probe_ed25519"
# Units and HTTPS health per service role (non-Vault nodes).
lab_service_probes:
  agent: { units: [vault-agent, seal-rotator.timer], url: "http://127.0.0.1:{{ agent_metrics_port }}/agent/v1/metrics" }
  proxy: { units: [haproxy], url: "https://{{ ansible_host | default('127.0.0.1') }}:8200/v1/sys/health" }
  identity: { units: [keycloak, openldap], url: "https://127.0.0.1:9000/health/ready" }
  ux: { units: [gt-ux], url: "https://127.0.0.1:3443/api/health" }

# ── Seal agent on gt-agent-1 (structure: terraform/seal) ─────────────────────
agent_user: vaultagent
agent_conf_dir: /etc/vault-agent
agent_state_dir: /var/lib/vault-agent
seal_approle: gt-seal-autounseal
seal_rotator_approle: gt-seal-rotator
seal_policy_name: autounseal
seal_rotate_every: 6h
# Wall-clock slots (00/06/12/18 h) with Persistent=true: a monotonic interval
# stands still while the Mac sleeps (red_pass c6fc9de).
seal_rotate_calendar: "*-*-* 00/6:00:00"

# ── Validation ───────────────────────────────────────────────────────────────
validation_report: "{{ build_dir }}/validation.json"
# Exact firewalld --list-ports per role (source-restricted ports are rich
# rules and are checked separately). Prompts 06–08 add proxy/identity/ux.
firewall_expected_ports:
  cluster: [8200/tcp, 8201/tcp]
  seal: [8200/tcp, 8201/tcp]
  agent: []
  proxy: [443/tcp, 8200/tcp, 8202/tcp, 8210/tcp, 8404/tcp, 8443/tcp, 9000/tcp]
  identity: []
  ux: []
clock_max_offset_seconds: 1.0
rotation_max_age_hours: 7

# ── Front door: HAProxy on gt-proxy-1 (prompt 06) ────────────────────────────
# Everything public points at the front door from day one: the Keycloak
# issuer, Vault's OIDC callbacks and the console origins (prompts 07/08).
proxy_dir: /etc/haproxy/golden-ticket
proxy_names: [vault.golden-ticket.lab, ui.golden-ticket.lab, id.golden-ticket.lab]
proxy_ports:
  vault: 8200
  vault_reads: 8202
  ui: 443
  keycloak: 8443
  seal: 8210
  nodes: 9000
  stats: 8404
front_door_url: "https://{{ hostvars[proxy_node].ansible_host | default(proxy_node) }}"
identity_kv_mount: secret
proxy_kv_path: golden-ticket/proxy
ux_port: 3443
keycloak_port: 8443
keycloak_mgmt_port: 9000
identity_realm: golden-ticket
keycloak_public_url: "{{ front_door_url }}:{{ proxy_ports.keycloak }}"
keycloak_issuer: "{{ keycloak_public_url }}/realms/{{ identity_realm }}"
# Written by identity.yml / ux.yml once their service is deployed; until
# then the matching front-door rows are "skipped", never "pass".
deployed_dir: "{{ build_dir }}/deployed"

# ── People: OpenLDAP + Keycloak on gt-identity-1 (prompt 07) ─────────────────
# Keycloak is decoration, so Ansible configures it. The policies these groups
# carry (gt-admin/operator/viewer) are Terraform's (terraform/platform).
identity_domain: golden-ticket.lab
identity_base_dn: dc=golden-ticket,dc=lab
identity_conf_dir: /etc/gt-identity
# Pinned multi-arch index digests (native linux/arm64; same pins as red_pass).
keycloak_image: docker.io/keycloak/keycloak:26.6.4@sha256:0aae0de7fca85525f727d3354df17896092de8bb26ae4c12d89c77e5df8cbce4
openldap_image: docker.io/osixia/openldap:1.5.0@sha256:18742e9c449c9c1afe129d3f2f3ee15fb34cc43e5f940a20f3399728f41d7c28
ldaps_port: 636
ldaps_url: "ldaps://{{ hostvars[identity_node].ansible_host | default(identity_node) }}:{{ ldaps_port }}"
identity_groups:
  gt-admins: { policy: gt-admin, ui_role: admin }
  gt-operators: { policy: gt-operator, ui_role: operator }
  gt-viewers: { policy: gt-viewer, ui_role: viewer }
identity_users:
  - { uid: raymon, cn: Raymon, sn: Epping, group: gt-admins }
  - { uid: barend, cn: Barend, sn: Demo, group: gt-operators }
  - { uid: viewer, cn: Viewer, sn: Demo, group: gt-viewers }
# Vault KV v2 (mount secret/, Terraform's) holding every identity secret.
identity_kv_path: golden-ticket/identity
identity_secret_keys: [ldap_admin_password, ldap_readonly_password, keycloak_admin_password, vault_client_secret, ui_client_secret, ui_session_password]
# The operator's Transit check uses the key Terraform declared
# (terraform/platform var.transit_keys).
identity_demo_transit_key: gt-demo
# Browser origins of the console (Keycloak redirect URIs, allowed Origins):
# the front door first, the console VM directly second.
ux_public_origins:
  - "{{ front_door_url }}"
  - "https://{{ hostvars[ux_node].ansible_host | default(ux_node) }}:{{ ux_port }}"
ux_host_origin: "http://127.0.0.1:3310"
# Vault OIDC callbacks: the front door, every cluster node, the CLI listener.
vault_oidc_redirect_uris: >-
  {{ [front_door_url ~ ':' ~ proxy_ports.vault ~ '/ui/vault/auth/oidc/oidc/callback']
     + (groups['vault'] | default([]) | map('extract', hostvars, 'ansible_host')
        | map('regex_replace', '^(.*)$', 'https://\1:8200/ui/vault/auth/oidc/oidc/callback') | list)
     + ['http://localhost:8250/oidc/callback'] }}

# ── Console on gt-ux-1 (prompt 08) ───────────────────────────────────────────
ux_user: gtux
ux_home: /opt/gt-ux
ux_conf_dir: /etc/gt-ux
ux_evidence_dir: /var/lib/gt-ux/evidence
ux_bundle_dir: "{{ build_dir }}/ux"
